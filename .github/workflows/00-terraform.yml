name: 00 - Terraform Infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to execute"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy

  pull_request:
    paths:
      - "terraform/**"

  push:
    branches:
      - main
    paths:
      - "terraform/**"

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || 'Validate & Plan' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./terraform

    env:
      ARM_CLIENT_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientId }}
      ARM_CLIENT_SECRET: ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientSecret }}
      ARM_SUBSCRIPTION_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).subscriptionId }}
      ARM_TENANT_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).tenantId }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Login to Azure CLI
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure Remote State Backend Exists
        run: |
          echo "Ensuring remote state backend resource group and storage account exist..."
          az group create --name tfstate-rg --location "Australia East" || true
          az storage account create \
            --name tfstate20245 \
            --resource-group tfstate-rg \
            --sku Standard_LRS \
            --encryption-services blob || true
          az storage container create \
            --name tfstate \
            --account-name tfstate20245 \
            --auth-mode login || true

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan

      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve
